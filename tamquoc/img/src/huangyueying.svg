  <path d="M143 150C143 158 141 164 138 169M165 150C165 158 167 163 171 167" stroke-width="1.12"/>

  <!-- mặt -->
  <path d="M130 96C128 116 130 134 138 146 144 155 150 158 155 158 161 158 168 154 172 146 178 134 180 114 178 96" fill="#f6ead0" stroke-width="1.24"/>
