<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="46 22 236 236">
<!-- Hoàng Nguyệt Anh – chân dung nét mực kiểu tranh khắc gỗ, BGVN tự vẽ (bản gốc, không dựa trên tranh nào) -->
<defs>
  <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
  </filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 -.9 .55"/></filter>
  <pattern id="lattice" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f0e2bf"/><path d="M0 3h6M3 0v6" stroke="#1d1712" stroke-width="0.56"/></pattern>
  <pattern id="cloud" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="#f0e2bf"/><path d="M2 7c0-3 4-3 4 0 0-3 4-3 4 0" fill="none" stroke="#1d1712" stroke-width="0.56"/></pattern>
</defs>
<rect x="0" y="0" width="320" height="320" fill="#f0e2bf"/>
<rect width="320" height="320" filter="url(#paper)" opacity=".5"/>

<g filter="url(#ink)" stroke="#1d1712" stroke-linecap="round" stroke-linejoin="round" fill="none">
