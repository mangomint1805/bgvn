  <path d="M138 112C142 109 147 109 151 111M160 111C164 108 169 108 173 111" stroke-width="0.99"/>
  <path d="M139 121C142 124 147 124 150 121M161 121C164 124 169 124 172 121" stroke-width="1.24"/>
  <path d="M155 124C154 132 153 136 156 138" stroke-width="0.81"/>
  <path d="M150 145C153 147 158 147 161 145" stroke-width="1.12"/>
  <path d="M152 146C154 148 157 148 159 146" stroke="#1d1712" stroke-width="1.61"/>
