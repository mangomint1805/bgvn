  <path d="M96 232C100 252 104 270 112 290M108 240C112 256 116 272 122 290" stroke-width="0.81"/>
  <ellipse cx="118" cy="244" rx="18" ry="8" transform="rotate(-28 118 244)" fill="#f0e2bf" stroke-width="1.24"/>
  <ellipse cx="118" cy="244" rx="12" ry="4.5" transform="rotate(-28 118 244)" fill="#1d1712" stroke-width="0.62"/>
  <path d="M104 236C100 230 102 222 108 220 114 218 120 222 120 228 120 234 114 238 108 238Z" fill="#f6ead0" stroke-width="0.99"/>
  <path d="M108 222c3 1 6 3 7 6M106 226c3 1 6 3 7 6M106 231c3 0 5 1 6 3" stroke-width="0.68"/>
</g>
<!-- chữ khắc góc phải -->
<g font-family="'Noto Serif CJK TC',serif" font-weight="500" font-size="22" fill="#1d1712" text-anchor="middle" opacity=".88">
  <text x="262" y="52">黃</text><text x="262" y="84">月</text><text x="262" y="116">英</text>
</g>
</svg>
