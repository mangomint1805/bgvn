  <path d="M130 116C126 118 126 126 131 128" stroke-width="0.87"/>
  <path d="M129 130v8" stroke-width="0.62"/><circle cx="129" cy="141" r="2.4" fill="#f0e2bf" stroke-width="0.74"/>

