  <g stroke-width=".7">
    <path d="M96 200C100 214 98 230 94 244M112 196C118 210 118 224 114 236M196 190C204 206 206 222 204 238M210 196C218 214 222 232 222 250M226 206C232 222 236 240 236 258"/>
    <path d="M190 214c6 4 10 10 12 18M196 240c6 6 8 14 8 22M140 300c4-6 10-10 16-12M190 304c4-8 10-12 16-14"/>
    <path d="M232 280l6-6M236 288l6-6M240 296l6-6M70 290l6-4M68 300l6-4M66 310l6-4"/>
