  <path d="M110 236L98 206" stroke-width="2.11"/>
  <path d="M110 236L98 206" stroke="#f0e2bf" stroke-width="0.62"/>
  <path d="M98 206C70 200 54 176 58 150 62 128 80 116 98 120 118 124 130 144 124 168 120 186 110 200 98 206Z" fill="#f6ead0" stroke-width="1.36"/>
  <path d="M98 206L66 160M98 206L74 136M98 206L90 122M98 206L106 124M98 206L120 146M98 206L122 172M98 206L58 176" stroke-width="0.68"/>
  <g stroke-width="0.5" opacity=".9">
    <path d="M80 182l-6-3M76 168l-7-2M82 154l-6-5M90 146l-3-7M100 146l1-7M108 154l5-5M112 166l7-2M108 180l6-1M86 194l-6 0"/>
  </g>
  <circle cx="98" cy="206" r="4" fill="#1d1712"/>
  <!-- tua quạt -->
  <path d="M104 238C98 252 96 262 92 272M106 238C104 254 104 264 102 276" stroke-width="0.74"/><circle cx="92" cy="274" r="2" fill="#1d1712"/><circle cx="102" cy="278" r="2" fill="#1d1712"/>

  <!-- tay áo rộng + bàn tay cầm quạt -->
