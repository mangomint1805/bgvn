  <path d="M126 112C118 90 124 68 142 60 160 52 182 60 188 80 192 96 188 112 182 124 182 108 178 98 170 92 160 98 146 96 136 92 130 98 128 104 126 112Z" fill="#1d1712" stroke-width="0.99"/>
