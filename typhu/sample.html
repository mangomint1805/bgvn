<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mẫu Phaser</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/typhu.css">
<style>
#game{position:absolute;inset:0}
.hud{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);background:#ffffffe6;border-radius:22px;box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3;width:min(320px,70vw)}
.hud .dice{height:56px}.hud .die{width:56px;height:56px}
@media (orientation:portrait){.hud{top:auto;bottom:14px;transform:translateX(-50%);padding:8px 12px}.hud .dice{height:44px}.hud .die{width:44px;height:44px}.stage{display:block!important}.players{position:absolute!important;top:0;left:0;right:0;inset:auto 0 auto 0;display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:4px!important;padding:4px 6px!important;align-items:start}.players .pcard{display:flex!important;flex-direction:column;align-items:center;padding:4px!important;gap:0}.players .pcard .pawn-ic{width:30px;height:30px}.players .pcard .pn{font-size:11px;max-width:100%}.players .pcard .cash{font-size:14px}.players .pcard .sub{display:none}#game{top:90px;bottom:120px}}
</style>
<script src="lib/phaser.min.js"></script></head><body>
<div class="sky" id="sky"></div>
<section class="screen active" style="flex-direction:column">
<header class="topbar"><button class="chip">←</button><div class="round-tag">Vòng 7</div><div class="timer">⏳ Bạn: <b>21s</b></div><div class="tools"><button class="chip">🎵</button><button class="chip">🔊</button><button class="chip">📖</button></div></header>
<div class="stage" style="position:relative;flex:1"><div id="game"></div><div class="players" id="players"></div>
<div class="hud"><div class="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div><button class="btn roll">🎲 Đổ xúc xắc</button><div class="c-hint">Tới lượt bạn!</div></div></div>
</section>
<script type="module">
import { BoardScene } from './js/scene.js';
import { skylineSVG } from './js/skyline.js';
import { money } from './js/board.js';
document.getElementById('sky').insertAdjacentHTML('beforeend', skylineSVG());
const players = [
  { id: 'a', name: 'Minto', avatar: '🧑‍💼', color: '#ff5a5f', pos: 0, cash: 1820, assets: 3650 },
  { id: 'b', name: 'Bé Na 🤖', avatar: '🐼', color: '#3d8bff', pos: 13, cash: 960, assets: 2410 },
  { id: 'c', name: 'Chú Tư 🤖', avatar: '👷', color: '#2fc76f', pos: 22, cash: 2310, assets: 2980 },
  { id: 'd', name: 'Cô Ba 🤖', avatar: '👩‍🍳', color: '#ffb020', pos: 22, cash: 540, assets: 1730 },
];
const props = { 1: { owner: 'a', level: 2 }, 2: { owner: 'a', level: 3 }, 4: { owner: 'b', level: 1 }, 5: { owner: 'c', level: 0 }, 9: { owner: 'b', level: 4 }, 10: { owner: 'b', level: 3 }, 14: { owner: 'd', level: 2 }, 17: { owner: 'c', level: 1 }, 21: { owner: 'a', level: 3 }, 22: { owner: 'a', level: 4 }, 26: { owner: 'c', level: 2 }, 28: { owner: 'd', level: 0 }, 31: { owner: 'a', level: 4 } };
const rents = {}; for (const k in props) rents[k] = [30, 120, 260, 480, 1350][props[k].level];
const view = { players, props, rents, festival: 22 };
const PIPS = { 4: [1, 3, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
[['d1', 4], ['d2', 6]].forEach(([id, n]) => { const el = document.getElementById(id); for (let k = 1; k <= 9; k++) { const i = document.createElement('i'); if (!PIPS[n].includes(k)) i.style.visibility = 'hidden'; el.appendChild(i); } });
document.getElementById('players').innerHTML = players.map((p, i) => `<div class="pcard p${i} ${i === 0 ? 'turn' : ''}" style="--pc:${p.color}"><span class="pawn-ic" style="background:${p.color}">${p.avatar}</span><div class="pn">${p.name}</div><div class="cash">${money(p.cash)}</div><div class="sub"><span>💎 ${money(p.assets)}</span></div></div>`).join('');
const place = sc => players.forEach(p => { const same = players.filter(q => q.pos === p.pos); sc.placePawn(p.id, p.pos, same.indexOf(p), same.length); });
let SC; const api = { placeAll() { SC && place(SC); }, ready(sc) { SC = sc; sc.sync(view, true); place(sc); setTimeout(() => sc.burst(31, '#ffd54a', 30), 300); } };
new Phaser.Game({ type: Phaser.AUTO, parent: 'game', transparent: true, scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' }, resolution: window.devicePixelRatio, scene: new BoardScene(api) });
</script></body></html>
