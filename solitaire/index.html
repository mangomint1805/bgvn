<script>/* 🌓 đặt chế độ tối ngay từ đầu (khỏi nháy trắng): 'sol-dark' = auto | light | dark */
(function(){var p='auto';try{p=localStorage.getItem('sol-dark')||'auto'}catch(e){}var d=p==='dark'||(p!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.classList.add('dark');document.documentElement.style.colorScheme='dark'}})();</script>
<link rel="stylesheet" href="../shared/ui/shell.css?v=2">
</head>
<body>
<div id="bgvn-splash" aria-hidden="true"><i></i><b></b></div><script>(function(){var s=document.getElementById("bgvn-splash");function h(){if(!s)return;var x=s;s=null;x.className="out";setTimeout(function(){x.remove()},320)}addEventListener("load",h);addEventListener("pageshow",h);setTimeout(h,4500)})()</script>
<div id="app">
  <header class="top">
    <a class="back-hub bgvn-chip" href="../" aria-label="Về trang chủ BGVN" title="Về trang chủ BGVN"><img src="../favicon.svg?v=1" alt="" width="26" height="26"><span>BGVN</span></a>
    <button class="vbtn" id="btn-variant" title="Tuỳ chọn ván"><span id="v-icon">🃏</span><b id="v-name">Xếp bài cổ điển</b><small id="v-opt"></small><i>▾</i></button>
    <div class="info">
      <button class="chip deal" id="btn-deal" title="Chọn số ván">Ván <b id="deal-no">#1</b></button>
      <span class="stat" title="Thời gian">⏱ <b id="timer">00:00</b></span>
      <span class="stat" title="Số nước">👣 <b id="moves">0</b></span>
      <span class="stat" id="score-wrap" title="Điểm">🏆 <b id="score">0</b></span>
    </div>
    <div class="tools">
      <button class="chip ic" id="btn-music" title="Nhạc nền" aria-label="Nhạc nền">🎵</button>
      <button class="chip ic" id="btn-mute" title="Âm thanh" aria-label="Âm thanh">🔊</button>
      <button class="chip ic" id="btn-guide" title="Hướng dẫn" aria-label="Hướng dẫn">📖</button>
      <button class="chip ic" id="btn-news" title="Có gì mới" aria-label="Có gì mới" data-news="solitaire">📝</button>
    </div>
  </header>
  <main id="felt"><div id="board" aria-label="Bàn xếp bài"></div></main>
  <button class="solv" id="solv" type="button" hidden aria-live="polite" title="Ván này còn giải được không (máy tự tính)"><i>🧠</i><span>Đang tính…</span></button>
  <nav class="acts" id="acts">
    <button class="act" id="btn-undo" title="Hoàn tác (Ctrl+Z)"><i>↶</i><span>Hoàn tác</span></button>
    <button class="act" id="btn-redo" title="Làm lại (Ctrl+Y)"><i>↷</i><span>Làm lại</span></button>
    <button class="act" id="btn-hint" title="Gợi ý (H)"><i>💡</i><span>Gợi ý</span></button>
    <button class="act" id="btn-safe" title="Đưa mọi lá lên được lên đích, y như Solitaire Windows (chuột phải / chạm 2 ngón / phím A)"><i>⤴️</i><span>Lên đích</span></button>
    <button class="act hot" id="btn-finish" title="Tự xếp nốt (F)" hidden><i>✨</i><span>Tự xếp nốt</span></button>
    <button class="act" id="btn-new" title="Ván mới (N)"><i>🆕</i><span>Ván mới</span></button>
    <button class="act" id="btn-more" title="Thêm"><i>☰</i><span>Thêm</span></button>
  </nav>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="win-canvas" hidden></canvas>
<script type="module" src="js/main.js?v=40"></script>
<script type="module" src="../shared/net/presence.js?v=12"></script>
<script type="module" async src="../shared/ui/feel.js?v=15"></script>
</body>
</html>
