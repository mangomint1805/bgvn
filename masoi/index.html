<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Sói – đêm trăng làng quê</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="BGVN">
<meta property="og:url" content="https://boardgamevui.com/masoi/">
<meta property="og:title" content="Ma Sói – chơi online cùng hội bạn | BGVN">
<meta property="og:description" content="Làng quê đêm trăng: Sói, Tiên tri, Bảo vệ, Phù thủy, Thợ săn, Cupid… máy làm quản trò, ai cũng dùng điện thoại riêng 🌕 Bấm link là vào chơi, không cần cài đặt.">
<meta property="og:image" content="https://boardgamevui.com/shared/img/og/masoi.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Ma Sói: trò chơi suy luận tiếng Việt chơi online cùng hội bạn, máy làm quản trò, có bot.">
<meta name="theme-color" content="#0b1030">
<link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml"><link rel="apple-touch-icon" href="/shared/img/brand/apple-touch-icon.png?v=1"><link rel="manifest" href="/manifest.webmanifest?v=1"><meta name="apple-mobile-web-app-title" content="BGVN"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/masoi.css?v=5">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<link rel="stylesheet" href="/shared/ui/shell.css?v=1">
</head>
<body class="th-night ph-home">
<div id="bgvn-splash" aria-hidden="true"><i></i><b></b></div><script>(function(){var s=document.getElementById("bgvn-splash");function h(){if(!s)return;var x=s;s=null;x.className="out";setTimeout(function(){x.remove()},320)}addEventListener("load",h);addEventListener("pageshow",h);setTimeout(h,4500)})()</script>
<!-- CẢNH LÀNG (vẽ bằng SVG/CSS) -->
<div id="scene" aria-hidden="true">
  <div class="sky s-night"></div><div class="sky s-dawn"></div><div class="sky s-day"></div><div class="sky s-dusk"></div><div class="sky s-blood"></div>
  <div class="stars" id="stars"></div>
  <div class="moon"><i></i><i></i><i></i></div><div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="hills" id="hills"></div>
  <div class="dinh" id="dinh"></div>
  <div class="bamboo left" id="bamboo-l"></div><div class="bamboo right" id="bamboo-r"></div>
  <div class="fog f1"></div><div class="fog f2"></div>
  <div class="fireflies" id="fireflies"></div>
  <div class="vignette"></div>
</div>

<!-- TRANG CHỦ -->
<section id="screen-home" class="screen active">
  <a class="back-hub bgvn-chip" href="../" aria-label="Về trang chủ BGVN" title="Về trang chủ BGVN"><img src="/favicon.svg?v=1" alt="" width="26" height="26"><span>BGVN</span></a>
  <div class="home-card">
    <div class="hero" id="hero"></div>
    <h1 class="logo">Ma <span>Sói</span></h1>
    <p class="tag">Trăng tròn, sương giăng rặng tre… trong làng có Sói! Máy làm quản trò, cả hội lo mà sống sót 🐺🌕</p>
    <label class="fld"><span>Tên của bạn</span><input id="name" maxlength="16" placeholder="Nhập tên…" autocomplete="nickname"></label>
    <div class="btn-col">
      <button class="btn big pri" id="btn-create">🏮 Tạo phòng online</button>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="MÃ PHÒNG" autocapitalize="characters" aria-label="Mã phòng"><button class="btn" id="btn-join">Vào</button></div>
      <button class="btn big" id="btn-offline">🤖 Chơi với bot</button>
      <button class="btn big green" id="btn-tutorial">🎓 Ván tập (cho người mới)</button>
    </div>
    <div class="home-tools">
      <button class="chip" id="btn-guide-home">📖 Hướng dẫn</button>
      <button class="chip" id="btn-music-home">🎵 Nhạc</button>
      <button class="chip" id="btn-news-home">📝 Có gì mới</button>
    </div>
    <p class="note">Bản fan-made phi thương mại. Ma Sói là trò chơi dân gian; hình vẽ, chữ, nhạc đều tự làm.</p>
  </div>
</section>

<!-- SẢNH -->
<section id="screen-lobby" class="screen">
  <div class="lobby">
    <div class="lobby-head">
      <button class="chip" id="btn-leave-lobby">← Thoát</button>
      <div class="code-box" id="code-box">Mã phòng <b id="room-code">…</b> <button class="chip sm" id="btn-copy">Chép link</button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h3>Dân làng <small id="pcount"></small></h3>
        <ul id="plist" class="plist"></ul>
        <div class="row-btns"><button class="btn" id="btn-addbot">＋ Thêm bot</button><button class="btn" id="btn-fill">🤖 Đủ 8 người</button></div>
      </div>
      <div class="panel">
        <h3>Bộ vai <small id="role-sum"></small></h3>
        <label class="opt auto"><input type="checkbox" id="opt-auto"><span><b>✨ Tự gợi ý theo số người</b><small>Bấm +/− để tự chỉnh từng vai.</small></span></label>
        <div id="suggest" class="suggest"></div>
        <div id="presets" class="presets"></div>
        <div id="roles" class="roles"></div>
        <p class="role-err" id="role-err"></p>
        <h3>Luật chơi</h3>
        <div id="opts" class="opts"></div>
      </div>
    </div>
    <button class="btn big pri" id="btn-start">🌕 Bắt đầu đêm đầu tiên</button>
    <p class="wait" id="wait-msg">🏮 Đang chờ chủ phòng bắt đầu…</p>
  </div>
</section>

<!-- VÁN CHƠI -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button class="chip ico" id="btn-leave" aria-label="Rời ván">←</button>
    <div class="phase" id="phase"></div>
    <div class="tools">
      <button class="chip ico" id="btn-music" title="Nhạc nền" aria-label="Nhạc nền">🎵</button>
      <input type="range" id="vol" min="0" max="1" step="0.05" title="Âm lượng nhạc" aria-label="Âm lượng nhạc">
      <button class="chip ico" id="btn-mute" title="Âm thanh" aria-label="Âm thanh">🔊</button>
      <button class="chip ico" id="btn-voice" title="Quản trò đọc (giọng máy)" aria-label="Quản trò đọc">🗣️</button>
      <button class="chip ico" id="btn-guide" title="Hướng dẫn" aria-label="Hướng dẫn">📖</button>
      <button class="chip ico" id="btn-news" title="Có gì mới" aria-label="Có gì mới">📝</button>
    </div>
  </header>
  <div class="clock" id="clock"><i></i><b></b></div>
  <div class="gwrap">
    <div class="gmain">
      <div class="narr" id="narr"></div>
      <div class="seats-wrap" id="seats-wrap"><div class="fire" id="fire" aria-hidden="true"></div><div class="seats" id="seats"></div></div>
      <div class="react-slot" id="react-slot"></div>
      <div class="act" id="act">
        <button class="mycard" id="mycard" aria-label="Giữ để xem vai của bạn"><span class="mc-art" id="mycard-art"></span><span class="mc-txt">Giữ để<br>xem vai</span></button>
        <div class="act-body" id="act-body"></div>
      </div>
    </div>
    <aside class="dock" id="dock">
      <div class="tabs" id="tabs"></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form class="say" id="say" autocomplete="off"><input id="say-in" maxlength="160" placeholder="Nói gì đó…" aria-label="Tin nhắn"><button class="btn pri" id="say-btn">Gửi</button><button type="button" class="chip ico" id="btn-dock" aria-label="Phóng to khung chat">⤢</button></form>
    </aside>
  </div>
</section>

<div class="peek" id="peek" aria-hidden="true"></div>
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<div id="fx-layer"></div>
<script type="module" src="js/main.js?v=23"></script>
<script type="module" src="../shared/ui/homebtn.js?v=16"></script>
<script type="module" src="/shared/ui/feel.js?v=2"></script>
</body>
</html>
