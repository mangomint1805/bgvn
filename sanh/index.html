<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sảnh chung – BGVN</title>
<meta name="description" content="Sảnh chung BGVN: tìm phòng công khai để chơi board game cùng người lạ, chat với mọi người.">
<meta property="og:title" content="Sảnh chung BGVN – tìm người chơi cùng">
<meta property="og:description" content="Phòng công khai của mọi game + chat chung. Bấm là vào chơi, không cần cài đặt.">
<meta property="og:image" content="https://boardgamevui.com/shared/img/og.jpg?v=2">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2340;--muted:#7b7391;--bg:#fff7ef}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden}
.blob{position:fixed;width:44vmax;height:44vmax;border-radius:50%;filter:blur(80px);opacity:.22;z-index:0;pointer-events:none}
.b1{background:#ff4d5e;left:-14vmax;top:-14vmax}.b2{background:#ffc23d;right:-14vmax;top:-8vmax}.b3{background:#2fc76f;left:-8vmax;bottom:-18vmax}.b4{background:#3d8bff;right:-12vmax;bottom:-16vmax}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px 16px 24px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:42px;padding:6px 16px;border-radius:999px;background:#fff9;border:1.5px solid #ecdfd0;color:var(--ink);text-decoration:none;font-weight:800}
h1{font-family:"Baloo 2";font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;flex:1;text-align:center}
h1 span{background:linear-gradient(90deg,#7b61ff,#3d8bff,#2fc76f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:-4px auto 0;max-width:640px;font-size:15px}
.online{text-align:center;margin:-6px auto 0;font:700 14px Nunito,sans-serif;color:#3a7a52;background:#fff9;border:1.5px solid #cdebd8;border-radius:999px;padding:4px 14px;width:max-content;max-width:100%}
#lobby{flex:1;min-height:0;display:flex;flex-direction:column}
#lobby .lb{flex:1}
@media (min-width:761px){#lobby .lb{height:calc(100dvh - 190px);min-height:480px}}
@media (max-width:520px){.top h1{order:3;flex-basis:100%}}
</style>
</head>
<body>
<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
<main>
  <div class="top"><a class="back" href="../">← Bàn chơi BGVN</a><h1>🌐 <span>Sảnh chung</span></h1><div id="acct"></div></div>
  <p class="sub">Tìm phòng công khai để vào chơi cùng người lạ, hoặc tạo phòng rồi bật <b>🌐 Công khai</b> để rủ thêm người 🥰</p>
  <p class="online" id="online" hidden></p>
  <div id="lobby"></div>
</main>
<script type="module">
import { mountAccount } from '../shared/ui/account.js?v=2';
import { mountLobby } from '../shared/ui/lobby.js?v=2';
import { mountOnline } from '../shared/net/presence.js?v=1';
mountOnline(document.getElementById('online'));
mountAccount(document.getElementById('acct'));
const g = new URLSearchParams(location.search).get('game');
const L = mountLobby(document.getElementById('lobby'), {});
if (g) setTimeout(() => document.querySelector(`.lb-gf button[data-g="${CSS.escape(g)}"]`)?.click(), 0);
</script>
</body>
</html>
