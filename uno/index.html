<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO Việt – chơi cùng bạn bè</title>
<meta name="description" content="UNO tiếng Việt chơi online cùng bạn bè: Cổ điển, Luật rừng, No Mercy. Có bot.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='18' y='6' width='64' height='88' rx='12' fill='%23ff4d5e'/><ellipse cx='50' cy='50' rx='22' ry='34' fill='white' transform='rotate(25 50 50)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/uno.css?v=11">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
</head>
<body>
<div class="bg-blobs"><i></i><i></i><i></i><i></i></div>

<!-- TRANG CHỦ -->
<section id="screen-home" class="screen active">
  <a class="back-hub" href="../">← Bàn chơi BGVN</a>
  <div class="home-card">
    <div class="hero-cards" id="hero-cards"></div>
    <h1 class="logo">UNO<span>Việt</span></h1>
    <p class="tag">Đánh bài màu cùng hội bạn – không cần cài đặt</p>
    <label class="fld"><span>Tên của bạn</span><input id="name" maxlength="16" placeholder="Nhập tên…"></label>
    <div class="btn-col">
      <button class="btn big pri" id="btn-offline">🤖 Chơi với bot</button>
      <button class="btn big" id="btn-create">✨ Tạo phòng online</button>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="MÃ PHÒNG"><button class="btn" id="btn-join">Vào</button></div>
    </div>
    <div class="home-tools">
      <button class="chip" id="btn-guide-home">📖 Hướng dẫn</button>
      <button class="chip" id="btn-music-home">🎵 Nhạc</button>
    </div>
    <p class="note">Bản fan-made phi thương mại, không liên kết với Mattel.</p>
  </div>
</section>

<!-- SẢNH -->
<section id="screen-lobby" class="screen">
  <div class="lobby">
    <div class="lobby-head">
      <button class="chip" id="btn-leave-lobby">← Thoát</button>
      <div class="code-box" id="code-box">Mã phòng <b id="room-code">…</b> <button class="chip sm" id="btn-copy">Sao chép</button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h3>Người chơi <small id="pcount"></small></h3>
        <ul id="plist" class="plist"></ul>
        <button class="btn" id="btn-addbot">＋ Thêm bot</button>
      </div>
      <div class="panel">
        <h3>Chế độ chơi</h3>
        <div id="modes" class="modes"></div>
        <h4>Tuỳ chỉnh luật</h4>
        <div id="rules" class="rules"></div>
      </div>
    </div>
    <button class="btn big pri" id="btn-start">▶ Bắt đầu</button>
    <p class="wait" id="wait-msg">Đang chờ chủ phòng bắt đầu…</p>
  </div>
</section>

<!-- VÁN CHƠI -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button class="chip" id="btn-leave">←</button>
    <div class="mode-tag" id="mode-tag"></div>
    <div class="tools">
      <select id="speed" class="chip" title="Tốc độ hiệu ứng"></select>
      <button class="chip" id="btn-music" title="Nhạc nền">🎵</button>
      <input type="range" id="vol" min="0" max="1" step="0.05" title="Âm lượng nhạc">
      <button class="chip" id="btn-mute" title="Âm thanh">🔊</button>
      <button class="chip" id="btn-guide" title="Hướng dẫn">📖</button>
      <button class="chip" id="btn-log" title="Nhật ký">📜</button>
    </div>
  </header>
  <div class="table" id="table">
    <div id="opps"></div>
    <div class="center" id="center">
      <div class="dir" id="dir"><svg viewBox="0 0 200 200"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><path d="M100 14 A86 86 0 0 1 186 100" marker-end="url(#ah)"/><path d="M100 186 A86 86 0 0 1 14 100" marker-end="url(#ah)"/></svg></div>
      <div class="pile deck" id="deck"><div class="ucard back"></div><div class="ucard back"></div><div class="ucard back"></div><span class="cnt" id="deck-cnt"></span></div>
      <div class="pile discard" id="discard"></div>
      <div class="color-dot" id="color-dot"></div>
      <div class="stack-badge" id="stack-badge"></div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="me" id="me">
    <div class="actions" id="actions"></div>
    <div class="hand" id="hand"></div>
  </div>
  <aside class="log" id="log"><h4>Nhật ký <button class="chip sm" id="btn-log-close">✕</button></h4><ol id="log-list"></ol></aside>
</section>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<div id="fx-layer"></div>
<script type="module" src="js/main.js?v=12"></script>
</body>
</html>
