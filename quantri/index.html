<!doctype html>
<html lang="vi" data-ui-sfx="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị – BGVN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg?v=1" type="image/svg+xml"><link rel="apple-touch-icon" href="../shared/img/brand/apple-touch-icon.png?v=1"><link rel="manifest" href="../manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-title" content="BGVN"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2340;--muted:#7b7391;--bg:#fff7ef;--line:#ecdfd0}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.5 Nunito,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:42px;padding:6px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:800}
h1{font:800 clamp(24px,6vw,38px) "Baloo 2",Nunito,sans-serif;margin:0;flex:1;text-align:center;white-space:nowrap}@media(max-width:560px){h1{order:-1;flex-basis:100%}.top{justify-content:space-between}}
.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 12px 28px -20px #2a234066}
input,button,select{font:inherit;padding:9px 12px;border-radius:12px;border:1.5px solid #e2d4c4}
button{background:var(--ink);color:#fff;border:0;cursor:pointer;font-weight:800}button.sm{padding:5px 11px;font-size:13px;border-radius:999px}button.red{background:#e0384a}button.gray{background:#8a7f96}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;scrollbar-width:none}.tabs button{flex:none;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:999px}.tabs button.on{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:0 8px 20px -16px #2a234066}.stat b{display:block;font:800 30px "Baloo 2",Nunito}.stat small{color:var(--muted)}
.it{background:#fff;border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 10px #0001}.meta{font-size:12.5px;color:#7a6f88;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{padding:2px 8px;border-radius:999px;background:#eee;font-weight:800}.bug{background:#ffd9dc}.idea{background:#dff5e6}.adm{background:#e6e0ff}
.msg{white-space:pre-wrap;margin:6px 0;word-break:break-word}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.r{margin-left:auto}
.muted{color:var(--muted)}
.cfl{display:inline-flex;align-items:center;min-height:38px;padding:6px 14px;border-radius:999px;background:#f6821f;color:#fff;text-decoration:none;font-weight:800;font-size:13.5px}.cfl:nth-child(n+2){background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.use h2{margin:0 0 4px;font:800 20px "Baloo 2",Nunito}.bar{height:14px;border-radius:999px;background:#f0e6da;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;border-radius:999px;background:#2fc76f;transition:width .4s}
.bar.warn i{background:#f5a524}.bar.full i{background:#e0384a}.alert{border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:800}.alert.warn{background:#fff1d6;color:#8a5a00}.alert.full{background:#ffd9dc;color:#a01828}
.days{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:10px}.days div{flex:1;text-align:center;font-size:11px;color:var(--muted)}.days span{display:block;background:#c9b8f5;border-radius:6px 6px 0 0;margin:0 auto 2px;width:70%;min-height:2px}.hrs{display:flex;gap:2px;align-items:flex-end;height:86px;margin-top:4px}.hrs div{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}.hrs span{display:block;background:#ffb27a;border-radius:4px 4px 0 0;margin:0 auto 2px;width:82%;min-height:2px}.hrs .now span{background:#ff7a45}.hrs em{font-style:normal;display:block;height:13px}.chart-h{font-weight:800;font-size:13.5px;margin-top:14px}.chart-h small{font-weight:700;color:var(--muted)}#st{min-height:22px;color:#c0263b;font-weight:700}
</style>
<link rel="stylesheet" href="../shared/ui/shell.css?v=2">
</head>
<body>
<div id="bgvn-splash" aria-hidden="true"><i></i><b></b></div><script>(function(){var s=document.getElementById("bgvn-splash");function h(){if(!s)return;var x=s;s=null;x.className="out";setTimeout(function(){x.remove()},320)}addEventListener("load",h);addEventListener("pageshow",h);setTimeout(h,4500)})()</script><main>
  <div class="top"><a class="back bgvn-chip" href="../" aria-label="Về trang chủ BGVN" title="Về trang chủ BGVN"><img src="../favicon.svg?v=1" alt="" width="26" height="26"><span>BGVN</span></a><h1>🛠️ Quản trị BGVN</h1><span id="acct"></span></div>
  <div id="gate" class="card" hidden></div>
  <div id="panel" hidden>
    <div class="card use" id="use"><p class="muted">Đang tải hạn mức…</p></div>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"><button data-t="rp" class="on">🚩 Báo cáo chat</button><button data-t="fb">💌 Góp ý</button><button data-t="bn">⛔ Đang cấm</button><button data-t="us">👤 Tài khoản</button></div>
    <p id="st"></p><div id="l"></div>
  </div>
</main>
<script type="module">
import { auth, API } from '../shared/net/api.js?v=1';
import { mountAccount, openLogin } from '../shared/ui/account.js?v=6';
import { confirmBox, promptBox, alertBox } from '../shared/ui/dialog.js?v=1';
import '../shared/net/presence.js?v=5';
mountAccount(document.getElementById('acct'));
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dt = t => new Date(t).toLocaleString('vi-VN'), T = { bug: '🐞 Lỗi', idea: '💡 Góp ý', other: '💬 Khác' };
let tab = 'rp';
async function api(body) {
  try { const r = await fetch(API() + '/admin/list', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + auth.token() }, body: JSON.stringify(body || {}) }); return await r.json(); }
  catch (e) { return { ok: false, msg: 'Không kết nối được máy chủ' }; }
}
async function gate() {
  const u = auth.user();
  if (u && u.admin) { $('#gate').hidden = true; $('#panel').hidden = false; go(tab); stats(); usage(); clearInterval(window.__useT); window.__useT = setInterval(usage, 60000); return; }
  $('#panel').hidden = true; $('#gate').hidden = false;
  if (!u) { $('#gate').innerHTML = '<h2 style="margin-top:0">Đăng nhập trước nha</h2><p>Trang này chỉ dành cho quản trị viên BGVN. Đăng nhập (Google hoặc tên đăng nhập) bằng tài khoản quản trị.</p><button id="g-login">👤 Đăng nhập</button>'; $('#g-login').onclick = () => openLogin(); return; }
  $('#gate').innerHTML = `<h2 style="margin-top:0">Kích hoạt quyền quản trị</h2><p>Bạn đang đăng nhập là <b>${esc(u.name)}</b>. Nhập mật khẩu quản trị (<code>ADMIN_KEY</code> đặt trên Cloudflare) <b>một lần</b> để cấp quyền cho tài khoản này. Lần sau chỉ cần đăng nhập là vào được.</p>
    <form id="g-f" style="display:flex;gap:8px;flex-wrap:wrap"><input id="g-k" type="password" placeholder="Mật khẩu quản trị" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:200px"><button>Kích hoạt</button></form><p id="g-e" style="color:#c0263b;font-weight:700"></p>`;
  $('#g-f').onsubmit = async e => { e.preventDefault(); const r = await fetch(API() + '/auth/claim-admin', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + auth.token() }, body: JSON.stringify({ key: $('#g-k').value }) }).then(r => r.json()).catch(() => ({ ok: false, msg: 'Lỗi mạng' }));
    if (r.ok) { localStorage.setItem('bgvn-auth', JSON.stringify({ token: auth.token(), user: r.user })); gate(); } else $('#g-e').textContent = r.msg; };
}
auth.onChange(() => gate()); auth.refresh().then(() => gate());
async function stats() {
  const s = await api({ op: 'stats' }); if (!s.ok) return;
  const on = await fetch(API() + '/presence').then(r => r.json()).catch(() => ({}));
  $('#stats').innerHTML = [[on.n ?? '–', '🟢 Đang online'], [s.online, '💬 Đang ở sảnh/web'], [s.rooms, '🚪 Phòng công khai'], [s.users, '🧑 Tài khoản']].map(([n, t]) => `<div class="stat"><b>${n}</b><small>${t}</small></div>`).join('');
}
// 📊 Hạn mức Cloudflare (ước tính, cập nhật mỗi phút)
const CF_DASH = 'https://dash.cloudflare.com/?to=/:account';
const hm = t => new Date(t).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
// 🎮 số đang chơi / online: nhận tức thì qua kết nối presence
let LIVE = window.__bgvnLive || null;
const drawLive = () => {
  const el = document.getElementById('live-line'); if (el) el.innerHTML = LIVE ? `🔴 <b>LIVE</b> · 🎮 Đang chơi: <b>${LIVE.rooms}</b> phòng · <b>${LIVE.players}</b> người · 🟢 online <b>${LIVE.n}</b>` : '🎮 Đang kết nối…';
  const s = document.querySelector('#stats .stat b'); if (s && LIVE) s.textContent = LIVE.n;
};
addEventListener('bgvn-live', e => { LIVE = e.detail; drawLive(); });
async function usage() {
  const u = await api({ op: 'usage' }); if (!u.ok) { $('#use').innerHTML = '<p class="muted">Chưa đọc được hạn mức (máy chủ chưa cập nhật?)</p>'; return; }
  const pg = Math.min(100, u.gbs / u.limGbs * 100), pr = Math.min(100, u.req / u.limReq * 100), lv = p => p >= 100 ? 'full' : p >= 85 ? 'warn' : '';
  const per = u.per === 'day' ? 'hôm nay' : 'tháng này', reset = u.per === 'day' ? 'Làm mới lúc ' + hm(u.resetAt) + ' sáng mai' : 'Làm mới ngày ' + new Date(u.resetAt).toLocaleDateString('vi-VN');
  const alert = u.level === 'full' ? `<div class="alert full">⛔ ĐÃ HẾT hạn mức ${per}! Phòng mới đang chạy bằng đường dự phòng (Firebase / P2P) – có thể chậm, rớt mạng. ${reset}. Muốn chạy tiếp ngay: nâng gói Workers Paid (5 USD/tháng).</div>`
    : u.level === 'warn' ? `<div class="alert warn">⚠️ Sắp hết hạn mức ${per} (${u.pct}%). ${u.eta ? 'Với tốc độ hiện tại sẽ hết khoảng <b>' + hm(u.eta) + '</b>.' : ''} ${reset}.</div>`
    : u.eta ? `<div class="alert warn">⏳ Với tốc độ hiện tại sẽ hết hạn mức khoảng <b>${hm(u.eta)}</b> – trước giờ làm mới.</div>` : '';
  const mx = Math.max(1, ...u.days.map(d => d.gbs));
  const hmx = Math.max(1, ...(u.hours || []).map(x => x.gbs)), hBest = (u.hours || []).reduce((a, x) => x.gbs > (a ? a.gbs : 0) ? x : a, null), hTop = hBest ? `${new Date(hBest.h).getHours()}h–${(new Date(hBest.h).getHours() + 1) % 24}h (${hBest.gbs} GB-s)` : 'chưa có';
  $('#use').innerHTML = `<h2>📊 Hạn mức máy chủ ${per} <small class="muted" style="font:700 13px Nunito">· gói ${u.plan === 'paid' ? 'Workers Paid' : 'Miễn phí'} · ước tính</small></h2>${alert}
    <div><b>⏱️ Thời gian chạy phòng:</b> ${u.gbs.toLocaleString('vi-VN')} / ${u.limGbs.toLocaleString('vi-VN')} GB-s (${pg.toFixed(1)}%)<div class="bar ${lv(pg)}"><i style="width:${pg}%"></i></div>
    <small class="muted">Còn khoảng <b>${u.roomHoursLeft} giờ-phòng</b> (vd. ${Math.floor(u.roomHoursLeft)} phòng chơi liền 1 tiếng) · đang dùng ~${u.rate.toLocaleString('vi-VN')} GB-s/giờ</small></div>
    <div style="margin-top:8px"><b>📨 Lượt gọi máy chủ:</b> ${u.req.toLocaleString('vi-VN')} / ${u.limReq.toLocaleString('vi-VN')} (${pr.toFixed(1)}%)<div class="bar ${lv(pr)}"><i style="width:${pr}%"></i></div></div>
    <p class="muted" style="margin:8px 0 0"><span id="live-line"></span> · cao điểm hôm nay: ${u.peak} người · ${reset}</p>
    <div class="chart-h">📅 7 ngày gần nhất <small>· GB-s mỗi ngày</small></div>
    <div class="days">${u.days.map(d => `<div title="${d.gbs} GB-s · ${d.req} lượt"><span style="height:${Math.round(d.gbs / mx * 50)}px"></span>${new Date(d.day).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })}</div>`).join('')}</div>
    ${u.hours ? `<div class="chart-h">🕐 24 giờ gần nhất <small>· thời gian chạy phòng theo từng giờ · đông nhất: ${hTop}</small></div><div class="hrs">${u.hours.map((x, i) => { const hh = new Date(x.h).getHours(); return `<div class="${i === 23 ? 'now' : ''}" title="${hh}:00–${(hh + 1) % 24}:00 · ${x.gbs} GB-s ≈ ${Math.round(x.gbs / 0.125 / 60)} phút-phòng · ${x.req} lượt"><span style="height:${Math.round(x.gbs / hmx * 62)}px"></span><em>${hh % 3 === 0 ? hh + 'h' : ''}</em></div>`; }).join('')}</div>` : ''}
    <div class="acts" style="margin-top:10px"><a class="cfl" href="${CF_DASH}/workers/services/view/bgvn-rooms/production/metrics" target="_blank" rel="noopener">📈 Số chính xác trên Cloudflare</a><a class="cfl" href="${CF_DASH}/workers/plans" target="_blank" rel="noopener">⬆️ Nâng gói Workers</a><a class="cfl" href="${CF_DASH}/workers/services/view/bgvn-rooms/production/settings" target="_blank" rel="noopener">⚙️ Cài đặt máy chủ</a></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">"Đang chơi" cập nhật tức thì (chỉ tính phòng online, không tính chơi với bot trên máy). Số hạn mức do BGVN tự đo nên lệch chút ít – bấm nút để xem số chính xác (cần đăng nhập Cloudflare).</p>`;
  drawLive();
}
async function go(t) {
  tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#st').textContent = ''; $('#l').innerHTML = '<p class="muted">Đang tải…</p>';
  const d = await api(t === 'fb' ? {} : t === 'us' ? { op: 'users', q: $('#uq')?.value || '' } : { op: 'reports' });
  if (!d.ok) { $('#st').textContent = d.msg || 'Lỗi'; $('#l').innerHTML = ''; return; }
  if (t === 'fb') $('#l').innerHTML = (d.items || []).map(i => `<div class="it"><div class="meta"><span class="tag ${i.t}">${T[i.t]}</span><b>${esc(i.game || 'chung')}</b><span>${dt(i.ts)}</span>${i.contact ? '<span>📮 ' + esc(i.contact) + '</span>' : ''}<button class="sm red r" data-del="${i.id}">Xoá</button></div><div class="msg">${esc(i.msg)}</div><div class="meta">${esc(i.page)} · ${esc(i.ua)}</div></div>`).join('') || '<p class="muted">Chưa có góp ý.</p>';
  if (t === 'rp') $('#l').innerHTML = (d.reports || []).map(r => `<div class="it"><div class="meta"><b>${esc(r.tname)}</b><span>${esc(r.target)}</span><span>${dt(r.ts)}</span><span class="r">báo bởi ${esc(r.rname)}</span></div><div class="msg">“${esc(r.text)}”${r.reason ? '\n<i>Lý do: ' + esc(r.reason) + '</i>' : ''}</div><div class="acts"><button class="sm" data-op="hide" data-msg="${r.msg}">🙈 Ẩn tin</button><button class="sm red" data-ban="${esc(r.target)}" data-h="24">Cấm 24h</button><button class="sm red" data-ban="${esc(r.target)}" data-h="168">Cấm 7 ngày</button><button class="sm red" data-ban="${esc(r.target)}" data-h="87600">Cấm vĩnh viễn</button><button class="sm gray" data-op="dismiss" data-id="${r.id}">Bỏ qua</button></div></div>`).join('') || '<p class="muted">Không có báo cáo nào 🎉</p>';
  if (t === 'bn') $('#l').innerHTML = (d.bans || []).map(b => `<div class="it"><div class="meta"><b>${esc(b.who)}</b><span>đến ${dt(b.until)}</span><span>${esc(b.reason)}</span><button class="sm r" data-unban="${esc(b.who)}">Gỡ cấm</button></div></div>`).join('') || '<p class="muted">Không ai bị cấm.</p>';
  if (t === 'us') { const q = $('#uq')?.value || ''; $('#l').innerHTML = `<form id="uf" style="display:flex;gap:8px"><input id="uq" placeholder="Tìm tên đăng nhập / tên / id" style="flex:1" value="${esc(q)}"><button>Tìm</button></form>` + (d.users || []).map(u => `<div class="it"><div class="meta"><b>${esc(u.name)}</b><span>@${esc(u.username || '(Google)')}</span><span>id ${u.id}</span><span>${dt(u.created)}</span>${u.admin ? '<span class="tag adm">🛠️ quản trị</span>' : ''}${u.banned ? '<span class="tag bug">bị khoá</span>' : ''}<span class="r"></span></div><div class="acts"><button class="sm ${u.banned ? '' : 'red'}" data-ub="${u.id}" data-v="${u.banned ? 0 : 1}">${u.banned ? 'Mở khoá' : 'Khoá tài khoản'}</button>${u.username ? `<button class="sm gray" data-pw="${u.id}">Đặt lại mật khẩu</button>` : ''}<button class="sm gray" data-adm="${u.id}" data-v="${u.admin ? 0 : 1}">${u.admin ? 'Bỏ quyền quản trị' : 'Cấp quyền quản trị'}</button></div></div>`).join(''); $('#uf').onsubmit = e => { e.preventDefault(); go('us'); }; }
}
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.t); };
$('#l').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.del) { if (!(await confirmBox('Góp ý này sẽ bị xoá hẳn.', { title: 'Xoá góp ý?', ok: 'Xoá', danger: true }))) return; await api({ del: b.dataset.del }); return go(tab); }
  if (b.dataset.op) { await api({ op: b.dataset.op, msg: b.dataset.msg, id: b.dataset.id }); return go(tab); }
  if (b.dataset.ban) { const reason = await promptBox('Người bị cấm sẽ thấy lý do này.', { title: '⛔ Cấm chat', placeholder: 'Lý do (không bắt buộc)', maxlength: 120, ok: 'Cấm' }); if (reason === null) return; await api({ op: 'ban', who: b.dataset.ban, hours: +b.dataset.h, reason }); return go(tab); }
  if (b.dataset.unban) { await api({ op: 'unban', who: b.dataset.unban }); return go(tab); }
  if (b.dataset.ub) { if (!(await confirmBox(b.dataset.v === '1' ? 'Tài khoản này sẽ bị khoá và đăng xuất khỏi mọi máy.' : 'Tài khoản này sẽ đăng nhập lại được.', { title: b.dataset.v === '1' ? 'Khoá tài khoản?' : 'Mở khoá tài khoản?', ok: b.dataset.v === '1' ? 'Khoá' : 'Mở khoá', danger: b.dataset.v === '1' }))) return; await api({ op: 'user', id: b.dataset.ub, patch: { banned: b.dataset.v === '1' } }); return go('us'); }
  if (b.dataset.adm) { if (!(await confirmBox(b.dataset.v === '1' ? 'Người này sẽ xem được báo cáo, góp ý và cấm được người chơi.' : 'Người này sẽ không vào được trang Quản trị nữa.', { title: b.dataset.v === '1' ? 'Cấp quyền quản trị?' : 'Bỏ quyền quản trị?', ok: b.dataset.v === '1' ? 'Cấp quyền' : 'Bỏ quyền', danger: b.dataset.v !== '1' }))) return; await api({ op: 'user', id: b.dataset.adm, patch: { admin: b.dataset.v === '1' } }); return go('us'); }
  if (b.dataset.pw) { const pw = await promptBox('Đặt xong thì nhắn mật khẩu mới cho người đó.', { title: '🔑 Đặt lại mật khẩu', placeholder: 'Mật khẩu mới (ít nhất 6 ký tự)', maxlength: 100, ok: 'Đặt lại' }); if (pw && pw.length >= 6) { await api({ op: 'user', id: b.dataset.pw, patch: { password: pw } }); await alertBox('Nhắn người đó mật khẩu mới nha.', { title: '✅ Đã đặt lại mật khẩu' }); } else if (pw) await alertBox('Mật khẩu cần ít nhất 6 ký tự.', { title: 'Chưa đặt được' }); }
};
