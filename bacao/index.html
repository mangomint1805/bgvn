<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ba Cào online – bài cào 3 lá cùng hội bạn | BGVN</title>
<link rel="canonical" href="https://boardgamevui.com/bacao/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BGVN">
<meta property="og:url" content="https://boardgamevui.com/bacao/">
<meta property="og:title" content="Ba Cào – chơi online cùng hội bạn | BGVN">
<meta property="og:description" content="Bài cào 3 lá: nặn bài hồi hộp, ba tây, sáp – có cái hoặc chơi gà 👑 Bấm link là vào chơi, không cần cài đặt.">
<meta property="og:image" content="https://boardgamevui.com/shared/img/og/bacao.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Ba Cào (bài cào 3 lá) chơi online cùng bạn bè bằng chip ảo, có bot, nặn bài, ba tây, sáp. Chơi vui, không cá cược tiền thật.">
<link rel="icon" href="../favicon.svg?v=1" type="image/svg+xml"><link rel="apple-touch-icon" href="../shared/img/brand/apple-touch-icon.png?v=1"><link rel="manifest" href="../manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-title" content="BGVN"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/bacao.css?v=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<link rel="stylesheet" href="../shared/ui/shell.css?v=2">
</head>
<body>
<div id="bgvn-splash" aria-hidden="true"><i></i><b></b></div><script>(function(){var s=document.getElementById("bgvn-splash");function h(){if(!s)return;var x=s;s=null;x.className="out";setTimeout(function(){x.remove()},320)}addEventListener("load",h);addEventListener("pageshow",h);setTimeout(h,4500)})()</script>
<div class="bg-suits" aria-hidden="true"></div>

<!-- TRANG CHỦ -->
<section id="screen-home" class="screen active">
  <a class="back-hub bgvn-chip" href="../" aria-label="Về trang chủ BGVN" title="Về trang chủ BGVN"><img src="../favicon.svg?v=1" alt="" width="26" height="26"><span>BGVN</span></a>
  <div class="home-card">
    <div class="hero" id="hero"></div>
    <h1 class="logo">Ba Cào<span>9 nút</span></h1>
    <p class="tag">Nặn từ từ… ba tây hay bù đây? 🤏👀</p>
    <label class="fld"><span>Tên của bạn</span><input id="name" maxlength="16" placeholder="Nhập tên…" autocomplete="nickname"></label>
    <div class="btn-col">
      <button class="btn big pri" id="btn-create">✨ Tạo phòng online</button>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="MÃ PHÒNG" autocomplete="off" aria-label="Mã phòng"><button class="btn" id="btn-join">Vào</button></div>
      <button class="btn big" id="btn-offline">🤖 Chơi với bot</button>
    </div>
    <div class="home-tools">
      <button class="chip" id="btn-guide-home">📖 Hướng dẫn</button>
      <button class="chip" id="btn-music-home">🎵 Nhạc</button>
      <button class="chip" id="btn-news-home" data-news="bacao">📝 Có gì mới</button>
    </div>
    <p class="note">🪙 Chơi vui bằng chip ảo, không cá cược tiền thật.<br>Bản fan-made phi thương mại.</p>
  </div>
</section>

<!-- SẢNH -->
<section id="screen-lobby" class="screen">
  <div class="lobby">
    <div class="lobby-head">
      <button class="chip" id="btn-leave-lobby">← Thoát</button>
      <div class="code-box" id="code-box">Mã phòng <b id="room-code">…</b> <button class="chip sm" id="btn-copy">Sao chép link</button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h3>Người chơi <small id="pcount"></small></h3>
        <ul id="plist" class="plist"></ul>
        <div class="row-btns"><button class="btn" id="btn-addbot">＋ Thêm bot</button><button class="chip sm" id="btn-fill">🤖 Lấp đầy bàn</button><button class="chip sm" id="btn-reset-chips">🧹 Chia lại vốn</button></div>
      </div>
      <div class="panel">
        <h3>Luật bàn</h3>
        <div id="opts" class="opts"></div>
      </div>
    </div>
    <button class="btn big pri" id="btn-start">🃏 Vào bàn</button>
    <p class="wait" id="wait-msg">Đang chờ chủ phòng bắt đầu…</p>
    <p class="note">🪙 Chơi vui bằng chip ảo, không cá cược tiền thật · Bản fan-made phi thương mại</p>
  </div>
</section>

<!-- VÁN CHƠI -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button class="chip ic" id="btn-leave" title="Rời bàn" aria-label="Rời bàn">←</button>
    <button class="round-tag" id="round-tag" title="Bảng chip"></button>
    <div class="tools">
      <button class="chip ic" id="btn-odds" title="Cửa thắng (chỉ khi chơi với bot)" aria-label="Cửa thắng">🎯</button>
      <button class="chip ic" id="btn-music" title="Nhạc nền" aria-label="Nhạc nền">🎵</button>
      <button class="chip ic" id="btn-mute" title="Âm thanh" aria-label="Âm thanh">🔊</button>
      <button class="chip ic" id="btn-guide" title="Hướng dẫn" aria-label="Hướng dẫn">📖</button>
      <button class="chip ic" id="btn-news" title="Có gì mới" aria-label="Có gì mới" data-news="bacao">📝</button>
      <button class="chip ic" id="btn-log" title="Nhật ký" aria-label="Nhật ký">📜</button>
    </div>
  </header>
  <div class="table" id="table">
    <div class="felt">
      <div class="dealer" id="dealer"></div>
      <div class="pot" id="pot"></div>
      <div class="hint" id="hint" aria-live="polite"></div>
      <div class="seats" id="seats"></div>
    </div>
  </div>
  <div class="me" id="me">
    <div class="me-top" id="me-top"></div>
    <div class="me-hand"><div class="hand" id="hand"></div><div class="pts" id="pts"></div></div>
    <div class="actions" id="actions"></div>
  </div>
  <aside class="log" id="log"><h4>Nhật ký <button class="chip sm" id="btn-log-close" aria-label="Đóng">✕</button></h4><ol id="log-list"></ol></aside>
</section>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<div id="fx-layer"></div>
<script type="module" src="js/main.js?v=42"></script>
<script type="module" async src="../shared/ui/homebtn.js?v=27"></script> <!-- async: chạy ngay khi tải xong, không chờ main.js (nặng) → nút hiện sớm, đỡ giật -->
<script type="module" async src="../shared/ui/feel.js?v=17"></script>
</body>
</html>
