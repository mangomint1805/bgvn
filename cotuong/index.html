<link rel="stylesheet" href="/shared/ui/gamekit.css?v=1">
<link rel="stylesheet" href="css/cotuong.css?v=2">

</head>
<body>
<div id="bgvn-splash" aria-hidden="true"><i></i><b></b></div><script>(function(){var s=document.getElementById("bgvn-splash");function h(){if(!s)return;var x=s;s=null;x.className="out";setTimeout(function(){x.remove()},320)}addEventListener("load",h);addEventListener("pageshow",h);setTimeout(h,4500)})()</script>

<!-- TRANG CHỦ -->
<section id="screen-home" class="screen active">
  <a class="back-hub bgvn-chip" href="../" aria-label="Về trang chủ BGVN" title="Về trang chủ BGVN"><img src="/favicon.svg?v=1" alt="" width="26" height="26"><span>BGVN</span></a>
  <div class="home-card">
    <div class="hero"><img src="../shared/img/icons/cotuong.svg?v=1" alt=""></div>
    <h1 class="logo">Cờ <span>tướng</span></h1>
    <p class="tag">Xe, Pháo, Mã ra trận – chiếu bí là thắng ♟️</p>
    <label class="fld"><span>Tên của bạn</span><input id="name" maxlength="16" placeholder="Nhập tên…" autocomplete="nickname"></label>
    <div class="btn-col">
      <button class="btn big pri" id="btn-offline">🤖 Đấu với máy / 2 người chung máy</button>
      <button class="btn big" id="btn-create">✨ Tạo phòng online</button>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="MÃ PHÒNG" autocomplete="off"><button class="btn" id="btn-join">Vào</button></div>
      <button class="btn big" id="btn-puzzle">🧩 Cờ thế – luyện chiếu bí</button>
    </div>
    <div class="home-tools">
      <button class="chip" id="btn-guide-home">📖 Luật chơi</button>
      <button class="chip" id="btn-news-home" data-news="cotuong">📝 Có gì mới</button>
    </div>
  </div>
</section>

<!-- PHÒNG CHỜ -->
<section id="screen-lobby" class="screen">
  <div class="lobby">
    <div class="lobby-head">
      <button class="chip" id="btn-leave-lobby">← Thoát</button>
      <div class="code-box" id="code-box">Mã phòng <b id="room-code">…</b> <button class="chip" id="btn-copy">Sao chép link</button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h3>Hai kỳ thủ <small id="pcount"></small></h3>
        <ul id="plist" class="plist"></ul>
        <div id="add-box"></div>
      </div>
      <div class="panel">
        <h3>Luật bàn</h3>
        <div id="opts"></div>
      </div>
    </div>
    <p class="wait" id="wait-msg">Đang chờ chủ phòng bắt đầu…</p>
    <div class="start-bar"><button class="btn big pri" id="btn-start">♟️ Vào bàn cờ</button></div>
  </div>
</section>

<!-- BÀN CỜ -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button class="chip ic" id="btn-leave" title="Rời ván" aria-label="Rời ván">←</button>
    <div class="turn" id="turn" aria-live="polite"></div>
    <span class="sp"></span>
    <div class="tools">
      <button class="chip ic" id="btn-style" title="Giao diện bàn cờ" aria-label="Giao diện bàn cờ">🎨</button>
      <button class="chip ic" id="btn-sound" title="Âm thanh" aria-label="Âm thanh">🔊</button>
      <button class="chip ic" id="btn-moves" title="Biên bản nước đi" aria-label="Biên bản nước đi">📜</button>
      <button class="chip ic" id="btn-guide" title="Luật chơi" aria-label="Luật chơi">📖</button>
    </div>
  </header>
  <div class="arena">
    <div class="pbar top" id="p-top"></div>
    <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Bàn cờ tướng"></div></div>
    <div class="pbar bottom" id="p-bot"></div>
    <div class="acts" id="acts"></div>
  </div>
</section>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="js/main.js?v=4"></script>
<script type="module" src="../shared/ui/homebtn.js?v=16"></script>
<script type="module" src="/shared/ui/feel.js?v=3"></script>
</body>
</html>
